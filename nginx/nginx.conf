worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Hide nginx version
    server_tokens off;

    # Reasonable defaults
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip JSON/text a bit
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;

    # Upstream = your Go service(s)
    # One instance for now; uncomment app2 when you scale.
    upstream url_shortener {
        least_conn;
        server app:8080 max_fails=3 fail_timeout=30s;
        # server app2:8080 max_fails=3 fail_timeout=30s;
    }

    # Trust Docker's internal network when reading X-Forwarded-For
    # (adjust if your compose network subnet differs)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 80;
        server_name _;   # any host / raw IP is fine for now

        # Reject huge bodies (shorten payloads are tiny)
        client_max_body_size 16k;

        # ---- Liveness-style: nginx itself is up ----
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ---- App health (for you / load balancer probes) ----
        location = /health/live {
            proxy_pass http://url_shortener;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /health/ready {
            proxy_pass http://url_shortener;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /metrics {
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # deny all;
            proxy_pass http://url_shortener;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else → Go app
        location / {
            proxy_pass http://url_shortener;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # Timeouts aligned with your Go server timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }
    }
}