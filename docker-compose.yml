services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app]
    mem_limit: 20m
    memswap_limit: 20m
    restart: unless-stopped

  app:
    build: .
    expose: ["8080"]
    env_file: .env
    environment:
      PORT: "8080"
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: url_shortener
      DB_SSLMODE: disable
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_ADDR: redis:6379
      MIGRATIONS_DIR: /migrations
      BASE_URL: ${BASE_URL}
      DB_MAX_OPEN_CONNS: "3"
      DB_MAX_IDLE_CONNS: "1"
      DB_CONN_MAX_LIFETIME_SEC: "120"
      DB_CONN_MAX_IDLE_TIME_SEC: "30"
      RATE_LIMIT_CAPACITY: "20"
      RATE_LIMIT_REFILL_PER_SEC: "0.3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 36m
    memswap_limit: 36m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: url_shortener
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - work_mem=512kB
      - -c
      - maintenance_work_mem=8MB
      - -c
      - effective_cache_size=32MB
      - -c
      - max_connections=10
      - -c
      - wal_buffers=256kB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 56m
    memswap_limit: 56m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 8mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 20m
    memswap_limit: 26m
    restart: unless-stopped

volumes:
  postgres_data: