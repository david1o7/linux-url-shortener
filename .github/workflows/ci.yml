name: Go CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download Dependencies
        run: go mod download

      - name: Verify Formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: |
          go test ./... \
            -v \
            -race \
            -coverprofile=coverage.out

      - name: Show Coverage
        run: go tool cover -func=coverage.out